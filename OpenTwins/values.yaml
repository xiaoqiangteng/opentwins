####################################################################################################################################
# OpenTwins helm chart
# Authors: Julia Robles, Sergio Infante, Altair Bueno
# For local testing: helm install opentwins ./ --wait --timeout=15m --dependency-update --debug
####################################################################################################################################



# Example digital twin
# Set to false if you don't need the Raspberry Pi example
##################################################################
example:
  enabled: false



# Persistent volumes
# Enabling these persistent volumes or not will depend on how your Kubernetes cluster works. 
# In our case, the cluster creates them automatically, so we don't need to activate them. 
# In other clusters we have seen that they are not created automatically, so to enable persistence it will be necessary to activate them.
##################################################################
persistentVolumes:
  grafana: false
  hono: false
  influxdb2: false



# OpenTwins connections
# Components can be automatically connected during installation.
##################################################################
connections:
  ditto:
    source:
      hono:
        enabled: false
        tenantName: ditto
        username: "ditto"
        password: "ditto"
      mosquitto:
        enabled: true
        address: "telemetry/#"
    target:
      mosquitto:
        enabled: true
        address: "opentwins/#"
      kafka:
        enabled: false
        topic: "opentwins"
  
  # The data received in Eclipse Ditto must be written to a messaging broker that acts as an intermediary with telegraf, the database collector. 
  # This broker can be Kafka (kafka) or Mosquitto (mqtt). 
  telegraf:
    source:
      mosquitto:
        enabled: true
    target:
      influxdb2:
        enabled: true       


# If you need to work with your own InfluxDB2 or connect more than one, you can add them here as a list.
# They will automatically connect to Grafana and Telegraf (if enabled).
externalInfluxdb2: {}
#  - name: anyName # Do not use hyphens or underscores
#    url: https://anyPlace/
#    bucket: anyBucket
#    organization: anyOrganization
#    token: anyToken


# If you need to work with your own Mosquitto or connect more than one, you can add them here as a list.
# Currently it only connects to Eclipse Ditto, although it is planned to allow it to replace the mosquitto that will be installed in the helm (and connect with Telegraf).
externalMosquitto: {}
#  - name: anyName # Do not use hyphens or underscores
#    uri: tcp://user:pass@hostname:1883 #{protocol}://{username}:{password}@{hostname}:{port}/{path}
#    addresses: 
#      - example/#
#      - example2/#


# OpenTwins recommended values for Eclipse Ditto
##################################################################
ditto:
  # OpenTwins custom values
  ####################################
  # Value to indicate if this component should be installed or not
  enabled: true 

  # Enables a workaround pod that cleans up stale connections that remain in a zombie state (neither open nor closed) after a crash.
  cleanupStaleConnections: true

  extraEnv:
    - name: DITTO_POLICIES_ENFORCE
      value: "false"

  things:
    extraEnv:
      - name: DITTO_POLICIES_ENFORCE
        value: "false"

  connectivity:
    extraEnv:
      - name: DITTO_POLICIES_ENFORCE
        value: "false"

  # Eclipse Ditto Helm Chart Values
  ####################################
  nameOverride: ditto
  global:
    hashedBasicAuthUsers: false
    basicAuthUsers:
      ditto:
        user: ditto
        password: ditto
      devops:
        user: devops
        password: foobar
  nginx:
    image:
      repository: crpi-ur4vz1dcuzowzd01.cn-beijing.personal.cr.aliyuncs.com/opentwins/nginx
      tag: "1.24"
      pullPolicy: IfNotPresent
    initContainers:
      waitForGateway:
        image: crpi-ur4vz1dcuzowzd01.cn-beijing.personal.cr.aliyuncs.com/opentwins/curlimages-curl:7.73.0
    service:
      type: NodePort
      nodePort: 30525
  swaggerui:
    enabled: false
  dittoui:
    enabled: false

  # ----------------------------------------------
  # Do not modify this unless you want to use your own mongodb or ditto mongodb. 
  # Opentwins can display two different mongodb charts. In case of displaying both, the bitnami one will take precedence.
  mongodb:
    enabled: false
    image: {}

  dbconfig:
    uriSecret: ditto-mongodb-connection-secret
  # ----------------------------------------------


  gateway:
    image:
      repository: crpi-ur4vz1dcuzowzd01.cn-beijing.personal.cr.aliyuncs.com/opentwins/ditto-gateway
      tag: 3.3.7
      pullPolicy: IfNotPresent
    config:
      authentication:
        enablePreAuthentication: true
        devops:
          devopsPassword: foobar
          statusPassword: foobar
    extraEnv:
      - name: DITTO_POLICIES_ENFORCE
        value: "false"

  # Add image configs for all Ditto components
  connectivity:
    image:
      repository: crpi-ur4vz1dcuzowzd01.cn-beijing.personal.cr.aliyuncs.com/opentwins/ditto-connectivity
      tag: 3.3.7
      pullPolicy: IfNotPresent

  things:
    image:
      repository: crpi-ur4vz1dcuzowzd01.cn-beijing.personal.cr.aliyuncs.com/opentwins/ditto-things
      tag: 3.3.7
      pullPolicy: IfNotPresent

  thingsSearch:
    image:
      repository: crpi-ur4vz1dcuzowzd01.cn-beijing.personal.cr.aliyuncs.com/opentwins/ditto-things-search
      tag: 3.3.7
      pullPolicy: IfNotPresent

  policies:
    enabled: true
    enforce:
      enabled: true
    image:
      repository: crpi-ur4vz1dcuzowzd01.cn-beijing.personal.cr.aliyuncs.com/opentwins/ditto-policies
      tag: 3.3.7
      pullPolicy: IfNotPresent
    # Note: Bootstrap policies via file mounting doesn't work with Ditto chart v3.3.7
    # because the env configuration gets overridden by the subchart defaults.
    # Policies are created via post-install job instead (see templates/post-install-jobs/post-install-ditto-default.yaml)
  #connectivity:
  #  readinessProbe:
  #    initialDelaySeconds: 30
  #  livenessProbe:
  #    initialDelaySeconds: 80

  fixerImage:
    repository: crpi-ur4vz1dcuzowzd01.cn-beijing.personal.cr.aliyuncs.com/opentwins/alpine
    tag: latest
    pullPolicy: IfNotPresent

# OpenTwins recommended values for Mosquitto
##################################################################
mosquitto:
  enabled: true # Value added by OpenTwins to indicate if this component should be installed or not
  nameOverride: mosquitto
  image:
    repository: crpi-ur4vz1dcuzowzd01.cn-beijing.personal.cr.aliyuncs.com/opentwins/eclipse-mosquitto
    tag: "2.0.14"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    nodePort: 30511
  configuration:
    authentication:
      enabled: false



# OpenTwins recommended values for Kafka
##################################################################
kafka:
  enabled: false
  autoCreateTopicsEnable: true
  


# OpenTwins recommended values for Telegraf
##################################################################
telegraf:
  enabled: true # Value added by OpenTwins to indicate if this component should be installed or not
  image:
    repo: crpi-ur4vz1dcuzowzd01.cn-beijing.personal.cr.aliyuncs.com/opentwins/telegraf
    tag: "1.36-alpine"
    pullPolicy: IfNotPresent
  metrics:
    internal:
      enabled: false
  config:
    processors: [] 
    outputs: [] 
    inputs: [] 
  service:
    enabled: false 
  volumes:
    - name: my-config
      configMap:
        name: opentwins-telegraf-real-config
  volumeMounts:
    - name: my-config
      mountPath: /additional_config
  args:
    - "--config=/etc/telegraf/telegraf.conf"
    - "--config-directory=/additional_config"
